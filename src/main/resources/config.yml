# Gracias por usar el plugin SuperPico3x3. Si tienes alguna pregunta o necesitas ayuda, no dudes en contactarme. ¡Disfruta de tu experiencia de minería mejorada!

# Este archivo de configuración te permite personalizar el comportamiento del plugin SuperPico3x3. Asegúrate de seguir la estructura YAML para evitar errores. Puedes modificar los valores según tus preferencias, pero ten cuidado al cambiar el radio de minado, ya que afectará a todos los picos 3x3, 5x5 o 7x7 en el servidor. Si tienes alguna duda sobre las opciones disponibles, consulta la documentación del plugin o contáctame para obtener asistencia. ¡Feliz minería!

# Recuerda que después de realizar cambios en este archivo, debes recargar la configuración del plugin para que los cambios surtan efecto. Puedes hacerlo usando el comando /pico3x3 reload o reiniciando el servidor. Si encuentras algún problema o tienes sugerencias para mejorar el plugin, no dudes en compartirlas conmigo. ¡Gracias por tu apoyo y disfruta de tu experiencia de minería mejorada con SuperPico3x3!

# Nota: Si deseas que el pico tenga un nombre personalizado, puedes usar el marcador {area} para que el nombre cambie automáticamente según el radio de minado. Por ejemplo, si el radio es 1, el nombre será "SUPER PICO 3x3". Si el radio es 2, el nombre será "SUPER PICO 5x5", y así sucesivamente. Esto te permite tener una experiencia de juego más personalizada y divertida. ¡Diviértete personalizando tu pico legendario!

# Si deseas que el pico tenga una descripción personalizada, puedes usar el marcador {area} en el lore para que la descripción cambie automáticamente según el radio de minado. Por ejemplo, si el radio es 1, el lore mostrará "Rompe bloques en un área 3x3". Si el radio es 2, el lore mostrará "Rompe bloques en un área 5x5", y así sucesivamente. Esto te permite tener una experiencia de juego más personalizada y divertida. ¡Diviértete personalizando tu pico legendario con descripciones únicas!

# Si deseas evitar que el pico destruya la bedrock (Piedra base), puedes activar la opción "prevent-bedrock-break". Esto es especialmente útil para servidores que desean mantener la integridad de la bedrock y evitar que los jugadores puedan romperla accidentalmente con el pico. Ten en cuenta que esta opción solo afecta a los picos legendarios creados por el plugin SuperPico3x3, por lo que otros picos normales seguirán pudiendo romper la bedrock si se les da el comando correspondiente. ¡Protege tu mundo de la bedrock con esta opción de configuración!

# Si deseas que solo los jugadores con OP puedan usar el comando /pico3x3 para obtener el pico legendario, puedes activar la opción "op-only". Esto es útil para servidores que desean restringir el acceso a este poderoso pico solo a los administradores o jugadores de confianza. Ten en cuenta que si esta opción está activada, cualquier jugador sin permisos de OP no podrá usar el comando para obtener el pico legendario, incluso si tiene los permisos necesarios para usar otros comandos del plugin. ¡Controla quién puede obtener el pico legendario con esta opción de configuración!

# Si estás utilizando WorldGuard en tu servidor, puedes configurar la opción "allow-unset-block-break" para permitir o denegar que los jugadores puedan romper bloques con el pico legendario en regiones que no tienen un dueño definido. Si esta opción está activada, los jugadores podrán usar el pico legendario para romper bloques en cualquier región sin dueño, lo que puede ser útil para servidores que desean permitir la minería en áreas públicas o sin protección. Sin embargo, si esta opción está desactivada, los jugadores no podrán usar el pico legendario para romper bloques en regiones sin dueño, lo que puede ayudar a proteger áreas importantes del servidor. ¡Configura esta opción según las necesidades de tu servidor y la experiencia de juego que deseas ofrecer a tus jugadores!

# Si deseas personalizar los mensajes que se muestran a los jugadores al usar el comando /pico3x3 o al interactuar con el pico legendario, puedes modificar las opciones en la sección "messages". Por ejemplo, puedes cambiar el mensaje que se muestra cuando un jugador recibe el pico legendario, el mensaje de error cuando un jugador sin permisos intenta usar el comando, o el mensaje que se muestra cuando un jugador intenta romper bedrock con el pico. Personalizar estos mensajes puede ayudar a mejorar la experiencia de juego y hacer que el plugin se sienta más integrado con tu servidor. ¡Diviértete personalizando los mensajes para tus jugadores!

# PLUGIN CREADO Y MANTENIDO POR: SrBanannito

